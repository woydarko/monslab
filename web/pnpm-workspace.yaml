# pnpm 11+/12
allowBuilds:
  esbuild: true
  "@reown/appkit": false
  bufferutil: false
  es5-ext: false
  keccak: false
  protobufjs: false
  utf-8-validate: false
# pnpm 10 (Vercel picks it for lockfile v9)
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - "@reown/appkit"
  - bufferutil
  - es5-ext
  - keccak
  - protobufjs
  - utf-8-validate
