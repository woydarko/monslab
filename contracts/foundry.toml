[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }, { access = "write", path = "../web/src/chain/abi" }]

[fmt]
line_length = 120

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
